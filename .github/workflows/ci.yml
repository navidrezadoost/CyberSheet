name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.22.0]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Reject focused test markers
        run: npm run check:no-focused-tests
      
      - name: TypeScript typecheck
        run: npm run typecheck --workspace @cyber-sheet/core

      - name: Core regression, patch, transaction, and deterministic perf smoke tests
        run: >-
          ./node_modules/.bin/jest
          --config packages/core/jest.config.cjs
          --ci --runInBand --coverage=false --runTestsByPath
          packages/core/__tests__/execution-kernel-regression.test.ts
          packages/core/__tests__/recompute-scheduler.test.ts
          packages/core/__tests__/spreadsheet-engine.test.ts
          packages/core/__tests__/formula-dag-integration.test.ts
          packages/core/__tests__/patch-engine.test.ts
          packages/core/__tests__/transaction-engine.test.ts
          packages/core/__tests__/dependency-propagation-benchmark.test.ts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: npx playwright test --project=chromium
      
      - name: Upload E2E test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

  renderer-tests:
    name: Renderer Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run renderer tests
        run: ./node_modules/.bin/jest --config packages/renderer-canvas/jest.config.cjs --ci --runInBand --coverage=false

  xlsx-tests:
    name: XLSX Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run XLSX tests
        run: NODE_OPTIONS=--experimental-vm-modules ./node_modules/.bin/jest --config packages/io-xlsx/jest.config.cjs --ci --runInBand --coverage=false

  framework-wrappers:
    name: Framework Wrapper Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        framework: [react, vue, angular, svelte]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build core packages
        run: npm run build
      
      - name: Test ${{ matrix.framework }} wrapper
        run: |
          cd packages/${{ matrix.framework }}
          npm test || echo "No tests configured for ${{ matrix.framework }}"
      
      - name: Lint ${{ matrix.framework }} wrapper
        run: |
          cd packages/${{ matrix.framework }}
          npm run lint || echo "No lint configured for ${{ matrix.framework }}"

  performance:
    name: Deterministic Performance Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check dependency propagation work counts
        run: >-
          ./node_modules/.bin/jest
          --config packages/core/jest.config.cjs
          --ci --runInBand --coverage=false --runTestsByPath
          packages/core/__tests__/dependency-propagation-benchmark.test.ts

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build all packages
        run: npm run build
      
      - name: Verify build outputs
        run: |
          echo "Checking build artifacts..."
          test -f packages/core/dist/index.js || (echo "Core build failed" && exit 1)
          test -f packages/renderer-canvas/dist/CanvasRenderer.js || (echo "Renderer build failed" && exit 1)
          test -f packages/react/dist/index.js || (echo "React wrapper build failed" && exit 1)
          echo "✓ All packages built successfully"
      
      - name: Check bundle sizes
        run: |
          echo "=== Bundle Sizes ==="
          du -h packages/core/dist/index.js || echo "Core bundle not found"
          du -h packages/renderer-canvas/dist/CanvasRenderer.js || echo "Renderer bundle not found"
          echo "Note: Implement size limits in future PR"

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, renderer-tests, xlsx-tests, framework-wrappers, performance, security, build-check]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.framework-wrappers.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ] || \
             [ "${{ needs.renderer-tests.result }}" != "success" ] || \
             [ "${{ needs.xlsx-tests.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
